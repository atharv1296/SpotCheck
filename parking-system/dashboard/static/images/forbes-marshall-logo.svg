<!-- Forbes Marshall Logo SVG -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <defs>
    <linearGradient id="fmGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#003366;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff6600;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="100" fill="white" stroke="#003366" stroke-width="2"/>
  
  <!-- Forbes Marshall Text -->
  <text x="150" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#fmGradient)">
    FORBES MARSHALL
  </text>
  
  <!-- SpotCheck Text -->
  <text x="150" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="normal" fill="#003366">
    SpotCheck Parking System
  </text>
  
  <!-- Version -->
  <text x="150" y="75" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="normal" fill="#666666">
    v2.0.0
  </text>
  
  <!-- Decorative elements -->
  <circle cx="30" cy="50" r="15" fill="#ff6600" opacity="0.8"/>
  <circle cx="270" cy="50" r="15" fill="#003366" opacity="0.8"/>
  
  <rect x="10" y="85" width="280" height="3" fill="url(#fmGradient)"/>
</svg>